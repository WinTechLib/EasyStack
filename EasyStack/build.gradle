import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

android {
    namespace 'io.github.wintechlib'
    compileSdk 34

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }}

dependencies {
    compileOnly 'org.firstinspires.ftc:Inspection:12.0.0'
    compileOnly 'org.firstinspires.ftc:Blocks:12.0.0'
    compileOnly 'org.firstinspires.ftc:RobotCore:12.0.0'
    compileOnly 'org.firstinspires.ftc:RobotServer:12.0.0'
    compileOnly 'org.firstinspires.ftc:OnBotJava:12.0.0'
    compileOnly 'org.firstinspires.ftc:Hardware:12.0.0'
    compileOnly 'org.firstinspires.ftc:FtcCommon:12.0.0'
    compileOnly 'org.firstinspires.ftc:Vision:12.0.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'}
mavenPublishing {
    configure(new AndroidSingleVariantLibrary("release", true, false))
    publishToMavenCentral('CENTRAL_PORTAL')
    signAllPublications()

    coordinates('io.github.ferreirovskizz', 'wintechlib', '1.0.4')

    pom {
        name = 'EasyStack'
        description = 'Biblioteca FTC simples para motores, PID e feedforward.'
        url = 'https://github.com/WinTechLib/EasyStack'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'ferreirovskizz'
                name = 'Joao'
                url = 'https://github.com/ferreirovskizz'
            }
        }
        scm {
            url = 'https://github.com/WinTechLib/EasyStack'
            connection = 'scm:git:git://github.com/WinTechLib/EasyStack.git'
            developerConnection = 'scm:git:ssh://git@github.com/WinTechLib/EasyStack.git'
        }
    }
}